name: sheepping
description: SheepPing - multi-host ping monitor with a macOS-style UI (Windows build).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  macos_ui: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/sheep_outline.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/inter-v20-latin-regular.ttf
          weight: 400
        - asset: assets/fonts/inter/inter-v20-latin-500.ttf
          weight: 500
        - asset: assets/fonts/inter/inter-v20-latin-600.ttf
          weight: 600
        - asset: assets/fonts/inter/inter-v20-latin-700.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/roboto/roboto-mono-v31-latin-regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/roboto-mono-v31-latin-500.ttf
          weight: 500
